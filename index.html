<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>EJERCILUCAS — Entrenador Personal</title>
  <meta name="description" content="Gestiona clientes, rutinas, ejercicios, nutrición y progreso — todo guardado localmente en tu navegador.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <link rel="stylesheet" href="css/styles.css">
  <!-- Rediseño amigable (Sprint 1): va después de styles.css -->
  <link rel="stylesheet" href="css/theme-amigable.css">
</head>
<body class="dark">

<div class="app-layout">

  <!-- ═══════════════ SIDEBAR ═══════════════ -->
  <aside class="sidebar">
    <div class="sidebar-logo">
      <span class="logo-icon">📈</span>
      <span>EJERCILUCAS</span>
    </div>

    <nav class="sidebar-nav">
      <div class="nav-group-label">Principal</div>
      <button class="nav-item active" data-tab="dashboard">🏠 Resumen</button>
      <button class="nav-item" data-tab="clientes">🧑‍🤝‍🧑 Clientes</button>

      <div class="nav-group-label">Entrenamiento</div>
      <button class="nav-item" data-tab="ejercicios">📚 Ejercicios y tutoriales</button>
      <button class="nav-item" data-tab="rutinas">🏋️ Rutinas</button>

      <div class="nav-group-label">Seguimiento</div>
      <button class="nav-item" data-tab="alimentacion">🍽️ Alimentación</button>
      <button class="nav-item" data-tab="progreso">📊 Progreso</button>

      <div class="nav-group-label">Configuración</div>
      <button class="nav-item" data-tab="ajustes">⚙️ Ajustes</button>
    </nav>

    <div class="sidebar-footer">
      <button class="btn-icon" id="dark-toggle-btn">
        <span id="dark-icon">🌙</span> <span id="dark-label">Modo oscuro</span>
      </button>
      <div style="position:relative;">
        <button class="btn-icon" id="backup-menu-btn" style="width:100%;">💾 Copia de seguridad</button>
        <div id="backup-menu" class="backup-menu">
          <div class="backup-menu-label">Respaldo rápido</div>
          <button class="backup-menu-item" id="backup-export-quick">📄 Descargar datos (JSON)</button>
          <div class="backup-menu-divider"></div>
          <div class="backup-menu-label" style="opacity:.7;">Más opciones en Ajustes ⚙️</div>
        </div>
      </div>
    </div>
  </aside>

  <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

  <!-- ═══════════════ MAIN ═══════════════ -->
  <main class="main-area">
    <header class="header">
      <button class="btn-icon" id="btn-toggle-sidebar" title="Menú" aria-label="Abrir menú">☰</button>
      <h1 class="header-title" id="page-title">Resumen</h1>

      <div class="control-group-inline">
        <span class="active-client-banner" id="active-client-banner"></span>
        <select id="client-select-global" class="filter-select" title="Cliente activo" aria-label="Cliente activo"></select>
        <button class="btn-icon" id="btn-glossary" title="Glosario: qué significan RIR, PR, RPE…" aria-label="Abrir glosario">❓</button>
        <button class="btn-icon" id="btn-new-client-header" title="Nuevo cliente" aria-label="Nuevo cliente">➕</button>
      </div>
    </header>

    <div class="page-content" id="page-content"></div>
  </main>
</div>

<!-- ═══════════════ BARRA INFERIOR (solo móvil) ═══════════════ -->
<nav class="bottom-nav" id="bottom-nav" aria-label="Navegación principal">
  <button class="bn-item active" data-tab="dashboard"><span class="bn-icon">🏠</span><span>Resumen</span></button>
  <button class="bn-item" data-tab="rutinas"><span class="bn-icon">🏋️</span><span>Rutinas</span></button>
  <button class="bn-item" data-tab="ejercicios"><span class="bn-icon">📚</span><span>Ejercicios</span></button>
  <button class="bn-item" data-tab="progreso"><span class="bn-icon">📊</span><span>Progreso</span></button>
  <button class="bn-item" id="bn-more"><span class="bn-icon">☰</span><span>Más</span></button>
</nav>

<!-- ═══════════════ MODAL GENÉRICO ═══════════════ -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal" id="modal">
    <div class="modal-header">
      <h3 id="modal-title"></h3>
      <button class="btn-icon-sm" id="modal-cancel-x" aria-label="Cerrar">✕</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-footer" id="modal-footer">
      <button class="btn-secondary" id="modal-cancel">Cancelar</button>
      <button class="btn-primary" id="modal-confirm">Guardar</button>
    </div>
  </div>
</div>

<div id="toast-host" class="toast-host"></div>

<script src="js/utils.js"></script>
<script src="js/storage.js"></script>
<script src="js/photos.js"></script>
<script src="js/state.js"></script>
<script src="js/muscleMap.js"></script>
<script src="js/charts.js"></script>
<script src="js/clients.js"></script>
<script src="js/exercises.js"></script>
<script src="js/routines.js"></script>
<script src="js/nutrition.js"></script>
<script src="js/progress.js"></script>
<script src="js/backup.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>
</body>
</html>
